name: release-binaries

# Builds a standalone `capa` binary for each major platform when a
# version tag is pushed (v0.5.0-alpha, v1.0.0, etc.) or when invoked
# manually from the Actions tab. The binary bundles a Python
# interpreter via PyInstaller, so end users do not need Python
# installed to run Capa programs.
#
# Each matrix job uploads its artefact to the matching GitHub Release
# (which must already exist; the workflow does not create the release)
# and generates a SLSA L2 build-provenance attestation for it through
# Sigstore (keyless OIDC, published to the Rekor transparency log).
#
# To verify a downloaded binary or install script on the consumer side:
#
#   gh attestation verify capa-linux-x86_64 --owner nelsonduarte
#   gh attestation verify install.sh        --owner nelsonduarte
#
# That confirms the file was produced by this repository's CI from the
# commit recorded in the attestation, which a `.sha256` cannot do: the
# hash only proves the download was not corrupted in transit.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the binaries to (e.g. v0.5.0-alpha)'
        required: true
        type: string

# Deny by default at the workflow level and grant per job, so a job added
# here later starts with no rights at all rather than silently inheriting
# release-upload and artefact-signing tokens.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # Sigstore OIDC for keyless signing
      attestations: write   # publish the SLSA provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            asset: capa-linux-x86_64
            ext: ''
          - os: macos-latest     # Apple Silicon
            label: macos-arm64
            asset: capa-macos-arm64
            ext: ''
          - os: windows-latest
            label: windows-x86_64
            asset: capa-windows-x86_64.exe
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install PyInstaller and the LSP stack
        # The LSP stack (pygls + lsprotocol + cattrs + attrs) must be
        # importable in the build environment so PyInstaller can bundle it
        # into the binary; otherwise `capa lsp` ships broken. Installing the
        # project's own `[lsp]` extra keeps the pinned set in one place
        # (pyproject.toml) instead of duplicating versions here.
        run: pip install "pyinstaller>=6.0" ".[lsp]"

      - name: Build binary
        run: pyinstaller deploy/capa.spec --distpath dist --workpath build/pyinstaller

      - name: Smoke-test binary (non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          ./dist/capa${{ matrix.ext }} --check examples/hello.capa
          ./dist/capa${{ matrix.ext }} --run examples/hello.capa
          ./dist/capa${{ matrix.ext }} --manifest examples/hello.capa > /dev/null

      - name: Smoke-test binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ./dist/capa.exe --check examples/hello.capa
          ./dist/capa.exe --run examples/hello.capa
          ./dist/capa.exe --manifest examples/hello.capa > /dev/null

      - name: Smoke-test LSP server in binary
        # Prove the bundled `capa lsp` actually serves the language server
        # rather than falling into the "pygls not installed" path (exit 2).
        # We drive the binary over stdio with a single LSP `initialize`
        # request, framed with Content-Length, and assert we get a JSON-RPC
        # result back. Driven from Python (via the matrix runner's system
        # Python, separate from the bundled interpreter) to stay identical
        # across the three platforms and avoid shell-quoting differences.
        shell: bash
        run: python deploy/lsp_smoke_test.py "dist/capa${{ matrix.ext }}"

      - name: Rename binary for upload
        shell: bash
        run: |
          mv "dist/capa${{ matrix.ext }}" "dist/${{ matrix.asset }}"

      - name: Compute SHA-256
        shell: bash
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"
          else
            sha256sum "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"
          fi
          cat "dist/${{ matrix.asset }}.sha256"

      - name: Generate SLSA L2 provenance
        # Runs after the rename, so the attested subject is byte for byte
        # the file uploaded below rather than the intermediate `dist/capa`.
        # Each matrix job attests only its own binary: the artefact exists
        # solely on the runner that built it, and attesting it there is what
        # ties the provenance to the build that actually produced it.
        # The `.sha256` sidecar is deliberately not attested; the digest it
        # contains is already the attestation subject.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/${{ matrix.asset }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          fail_on_unmatched_files: true

  installer:
    name: Publish install scripts
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # Sigstore OIDC for keyless signing
      attestations: write   # publish the SLSA provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Compute SHA-256
        # Hash with a bare filename (cd into deploy/) so that a user who
        # downloads an install script and its .sha256 side by side can run
        # `sha256sum -c install.sh.sha256` without a path-prefix mismatch.
        run: |
          cd deploy
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256

      - name: Generate SLSA L2 provenance
        # The install scripts are the highest-value target in this release:
        # they are what a user pipes straight into a shell. They are uploaded
        # verbatim from the checkout, so attesting the checked-out paths
        # attests exactly the bytes that get published.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: |
            deploy/install.sh
            deploy/install.ps1

      - name: Upload installers to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            deploy/install.sh
            deploy/install.sh.sha256
            deploy/install.ps1
            deploy/install.ps1.sha256
          fail_on_unmatched_files: true
