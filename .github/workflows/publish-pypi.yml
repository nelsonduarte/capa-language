name: publish-pypi

# Publishes the `capa-language` sdist and wheel to PyPI using PyPI Trusted
# Publishing (OpenID Connect), so no long-lived API token is ever stored in
# this repository. GitHub mints a short-lived OIDC token per run and PyPI
# exchanges it for upload rights, scoped to this repository, this workflow
# file and the named environment. Nelson registers the trusted publisher on
# PyPI/TestPyPI against the exact environment names below (`pypi` and
# `testpypi`); they must match there and here or the exchange is rejected.
#
# Two paths share one build:
#
#   - publishing a GitHub Release ships that build to the real PyPI;
#   - a manual run from the Actions tab ships it to TestPyPI instead, so a
#     release can be rehearsed end to end before it is cut.
#
# The publish action emits PEP 740 attestations by default on the
# trusted-publishing flow. They are left on deliberately: attested provenance
# for every wheel and sdist is the point, not an extra.

on:
  release:
    types: [published]
  workflow_dispatch: {}

# Deny by default at the workflow level and grant per job, so a job added
# here later starts with no rights at all rather than silently inheriting the
# OIDC token that authorises a publish.
permissions: {}

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI (dry-run)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/capa-language
    permissions:
      id-token: write   # mint the OIDC token trusted publishing exchanges
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/capa-language
    permissions:
      id-token: write   # mint the OIDC token trusted publishing exchanges
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
