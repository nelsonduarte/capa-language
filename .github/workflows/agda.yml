name: agda

on:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
      - '.github/workflows/agda.yml'
  pull_request:
    branches: [main]
    paths:
      - 'proofs/**'
      - '.github/workflows/agda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck Agda proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: wenkokke/setup-agda@52f1e708494c8717630b3e1378383b01a56a379c  # v2.5.0
        with:
          agda-version: '2.6.4.3'
      - name: Typecheck CapaSyntax
        working-directory: proofs
        run: agda --safe CapaSyntax.agda
      - name: Typecheck CapaSoundness
        working-directory: proofs
        run: agda --safe CapaSoundness.agda
      - name: Typecheck CapaIF
        working-directory: proofs
        run: agda --safe CapaIF.agda
      - name: Typecheck CapaNoninterference
        working-directory: proofs
        run: agda --safe CapaNoninterference.agda
