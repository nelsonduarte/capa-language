name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default the workflow token to read-only. Jobs that need more must
# override per-job.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package
        # The `.[test]` extra adds hypothesis (and pytest) for the
        # property-based suite in tests/test_properties.py. The
        # core compiler keeps no third-party runtime dependencies.
        run: pip install -e .[test]

      - name: Run the test suite
        run: python -m unittest discover tests -v

      - name: Smoke run a few examples
        shell: bash
        run: |
          for f in hello basics grades tasks io patterns json python_interop; do
            echo "--- $f ---"
            python -m capa --run "examples/$f.capa"
          done

  audit:
    # Fail the build on a known-vulnerable Python dependency. Nothing
    # else in CI gates on advisories, so a compromised, withdrawn, or
    # newly-CVE'd transitive dependency would otherwise ship silently.
    #
    # Scope: we audit the surface that actually reaches users and
    # developers - the package plus the `[lsp,wasm,test]` extras (the
    # distributed-binary surface + dev tooling). The `[eval]` extra
    # (matplotlib -> pillow / numpy) is DELIBERATELY excluded: it is a
    # paper-figure-only stack, a magnet for transitive CVEs outside our
    # control, and pulling it in would turn this gate into a source of
    # false-red flakiness with no bearing on what we ship.
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install the audited surface into a venv
        # Resolve the exact dependency tree pip-audit will scan - the
        # package plus the lsp/wasm/test extras - into a dedicated venv
        # the action then audits directly (via `virtual-environment`).
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip
          .audit-venv/bin/python -m pip install -e .[lsp,wasm,test]

      - name: Audit dependencies for known vulnerabilities
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          # Audit the packages installed in the venv above, not the repo
          # tree, so the resolved transitive set is what gets scanned.
          virtual-environment: .audit-venv
          vulnerability-service: osv
          # No advisories are ignored: the audited surface
          # (capa[lsp,wasm,test]) is clean today. If a transitive CVE
          # with no available fix ever surfaces here, add its ID to this
          # whitespace-separated list with a one-line justification
          # (advisory source, why it is unreachable or has no fix), e.g.
          #   ignore-vulns: "GHSA-xxxx-xxxx-xxxx"  # transitive, no fix, sink unreachable
          # Do NOT ignore anything pre-emptively.
          ignore-vulns: ""

  wasi:
    # Experimental --wasi mode (WASI Preview 2). The main `test` job runs
    # on three OSes WITHOUT the Wasm toolchain, so its WASI tests skip
    # cleanly. This dedicated job installs the toolchain so the WASI
    # end-to-end suite actually executes: the wasmtime Python binding
    # (the `wasm` extra) and the wasm-tools binary, pinned by tag.
    name: WASI Preview 2 (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    env:
      # Pinned wasm-tools release. The WASI end-to-end tests shell out to
      # `wasm-tools component embed`/`new`; the binding the http recipe
      # reaches is provided by the `wasm` extra (wasmtime).
      WASM_TOOLS_VERSION: "1.249.0"

    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install the package with the wasm extra
        # The `wasm` extra adds the wasmtime Python binding. The
        # experimental --wasi mode reaches wasi:http through wasmtime's
        # C-ABI (validated on wasmtime 44 and 45); the extra pins the
        # supported floor.
        run: pip install -e .[test,wasm]

      - name: Install wasm-tools (pinned)
        run: |
          set -euo pipefail
          base="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${base}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o /tmp/wasm-tools.tar.gz
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          install -Dm755 "/tmp/${base}/wasm-tools" "$HOME/.local/bin/wasm-tools"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify the toolchain is present
        run: |
          wasm-tools --version
          python -c "import importlib.metadata as m; print('wasmtime', m.version('wasmtime'))"

      - name: Run the test suite (WASI tests now execute)
        run: python -m unittest discover tests -v

      - name: Wasm/Python example parity gate
        # The main `test` job smoke-runs examples ONLY under the Python
        # interpreter, so a Wasm-only codegen regression can ship green
        # (exactly what PR #31 did: `?` over Result<Unit, E> broke
        # examples/io.capa under --wasm while CI stayed green). This job
        # has the toolchain, so it re-runs a curated set of examples on
        # the Python oracle, the core Wasm backend, and the Component
        # backend, and fails if any backend diverges in exit code or
        # stdout. The curated include/exclude lists live in the script.
        shell: bash
        run: scripts/wasm_parity_smoke.sh
