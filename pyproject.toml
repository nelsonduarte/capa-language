[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capa"
version = "1.14.0"
description = "Capa, a capability-centric programming language"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Nelson Duarte", email = "nelson.duarte31@gmail.com" },
]
keywords = ["language", "compiler", "capabilities", "type-checker", "transpiler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
# Install with: `pip install -e .[lsp]`. Required only when running
# the language server (`python -m capa lsp`); the rest of the
# compiler stays dependency-free on the standard library.
lsp = ["pygls>=2.0"]
# Install with: `pip install -e .[test]`. Adds the libraries needed
# to run the full test suite, including the property-based tests in
# `tests/test_properties.py` that fuzz the lexer / parser /
# formatter with Hypothesis.
test = ["pytest>=7", "hypothesis>=6"]
# Install with: `pip install -e .[eval]`. Brings the matplotlib +
# numpy stack used by the empirical-study scripts under
# `evaluation/`. The core compiler does not depend on these; they
# are only needed to regenerate the paper figures.
eval = ["matplotlib>=3.8"]
# Install with: `pip install -e .[wasm]`. Adds the wasmtime
# Python binding so ``capa --wasm --run`` (and the eventual
# Wasm-preferred path via ``--prefer-wasm``) work without an
# external pip install. The ``wasm-tools`` binary still needs to
# be on PATH separately - it ships as a Rust executable and is
# the only piece of the Wasm pipeline Python cannot vendor.
#
# The experimental ``--wasi`` mode additionally reaches wasi:http
# through wasmtime's C-ABI (``wasmtime._bindings``:
# ``wasmtime_component_linker_add_wasi_http`` +
# ``wasmtime_context_set_wasi_http``), which the high-level
# component API does not surface. Those symbols are present and the
# Net end-to-end suite passes on both wasmtime 44 and 45, so 44 is
# the validated floor.
wasm = ["wasmtime>=44"]

[project.scripts]
capa = "capa.cli:main"

[project.urls]
Homepage = "https://capa-language.com"
# Repository = "..."

[tool.setuptools.packages.find]
# Auto-discover every ``capa.X`` subpackage so the wheel ships
# the whole compiler. The previous explicit ``["capa",
# "capa.runtime"]`` list shipped only two of the 13 subpackages
# on disk, producing wheels that ImportError'd at first use for
# anything beyond the public API in ``capa.__init__``.
include = ["capa", "capa.*"]
