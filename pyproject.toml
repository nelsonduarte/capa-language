[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution (PyPI) name. The import package stays ``capa`` (see
# ``[tool.setuptools.packages.find]`` below) and the console script
# stays ``capa`` (see ``[project.scripts]``); only the distribution
# identity is ``capa-language``.
name = "capa-language"
version = "1.29.0"
description = "A capability-typed language that emits machine-verifiable supply-chain SBOMs by construction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Nelson Duarte", email = "nelson@capa-language.com" },
]
keywords = ["language", "compiler", "capabilities", "type-checker", "transpiler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
# Install with: `pip install -e .[lsp]`. Required only when running
# the language server (`python -m capa lsp`); the rest of the
# compiler stays dependency-free on the standard library.
lsp = ["pygls>=2.0"]
# Install with: `pip install -e .[test]`. Adds the libraries needed
# to run the full test suite, including the property-based tests in
# `tests/test_properties.py` that fuzz the lexer / parser /
# formatter with Hypothesis. The pytest floor is 9.0.3 to exclude
# CVE-2025-71176 (GHSA-6w46-j5rx-g56g, predictable tmpdir; test-only,
# local), which affects pytest < 9.0.3.
#
# PyYAML is here because the release supply-chain guards in
# `tests/test_release_workflow.py` and `tests/test_release_guards.py`
# parse the workflow YAML, and they were previously written to SKIP when
# it was missing. It was declared nowhere, so on a correctly installed
# environment those tests did not run at all: eleven checks, including
# "every action is pinned to a commit SHA" and "every uploaded artefact
# is attested", reported OK while executing nothing. Declaring it makes
# the import unconditional, so a missing PyYAML is now a loud ERROR
# under `python -m unittest discover tests` instead of a silent pass.
test = ["pytest>=9.0.3", "hypothesis>=6", "pyyaml>=6"]
# Install with: `pip install -e .[eval]`. Brings the matplotlib +
# numpy stack used by the empirical-study scripts under
# `evaluation/`. The core compiler does not depend on these; they
# are only needed to regenerate the paper figures.
eval = ["matplotlib>=3.8"]
# Install with: `pip install -e .[wasm]`. Adds the wasmtime
# Python binding so ``capa --wasm --run`` (and the eventual
# Wasm-preferred path via ``--prefer-wasm``) work without an
# external pip install. The ``wasm-tools`` binary still needs to
# be on PATH separately - it ships as a Rust executable and is
# the only piece of the Wasm pipeline Python cannot vendor.
#
# The experimental ``--wasi`` mode additionally reaches wasi:http
# through wasmtime's C-ABI (``wasmtime._bindings``:
# ``wasmtime_component_linker_add_wasi_http`` +
# ``wasmtime_context_set_wasi_http``), which the high-level
# component API does not surface. Those symbols are present and the
# Net end-to-end suite passes on both wasmtime 44 and 45, so 44 is
# the validated floor.
wasm = ["wasmtime>=44"]

[project.scripts]
capa = "capa.cli:main"

[project.urls]
Homepage = "https://capa-language.com"
Repository = "https://github.com/nelsonduarte/capa-language"
Documentation = "https://github.com/nelsonduarte/capa-language/tree/main/docs"
Changelog = "https://github.com/nelsonduarte/capa-language/blob/main/CHANGELOG.md"
Issues = "https://github.com/nelsonduarte/capa-language/issues"

[tool.setuptools.packages.find]
# Auto-discover every ``capa.X`` subpackage so the wheel ships
# the whole compiler. The previous explicit ``["capa",
# "capa.runtime"]`` list shipped only two of the 13 subpackages
# on disk, producing wheels that ImportError'd at first use for
# anything beyond the public API in ``capa.__init__``.
include = ["capa", "capa.*"]

[tool.setuptools.package-data]
# Runtime data files the compiler loads from inside the ``capa`` import
# package via ``Path(__file__)``. setuptools ships only ``.py`` files by
# default, so without this the installed compiler FileNotFounds the moment
# a user hits the Wasm-component path or the bundled JSON parser.
#
# ``capa/ir/_builtin_json.capa`` is the bundled JSON parser source spliced
# in on the Wasm path; ``capa/ir/_builtin_json.py`` reads it from beside
# itself. It belongs to the ``capa.ir`` package (that directory has an
# ``__init__.py``).
"capa.ir" = ["_builtin_json.capa"]
# ``capa/wasi_wit`` holds the vendored WASI Preview 2 WIT. ``capa/cli.py``
# copies the whole ``wasi_wit/deps`` tree next to the generated world so
# ``capa --wasm --component`` (WASI mode) can resolve ``wasi:*`` offline,
# and reads it for ``capa --wit``. It is not an import package (no
# ``__init__.py``), so its files attach to the enclosing ``capa`` package.
# Glob the entire subtree so every file the ``shutil.copytree`` copies
# ships, whatever its extension.
"capa" = ["wasi_wit/**/*"]
